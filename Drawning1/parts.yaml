# =====================================================================
#  Единый источник данных изделия. Развёртки и массы НЕ пишутся руками -
#  они вычисляются в calc.py. Поле mass_ref - контрольное значение из
#  бумажной спецификации, по нему build.py сверяет расчёт.
# =====================================================================
project:
  title: Закладная деталь ЗД1 и арматурный каркас
  sheet: Данный лист

materials:
  steel_rho: 7850           # кг/м3
  concrete:
    name: Бетон класса В15, ГОСТ 26633-2015
    volume: 0,69 м³

parts:

  1:
    kind: purchased
    section: Сборочные единицы
    subsection: Сетка арматурная
    designation: ГОСТ 23279-2012
    name_fraction:
      prefix: "2С"
      top: 12А400
      bottom: 12А400
      suffix: 85x85
    qty: 1
    mass_ref: 7,7

  2:
    kind: purchased
    subsection: Изделия закладные
    designation: ТЛ.И-1342-21
    name_lines: ["219. Заготовка", "с отводом 90° Ду200"]
    qty: 1
    mass_ref: 100,2

  3:
    kind: hook               # подвеска: три гиба 180 градусов
    bar: {d: 14, cls: А240, gost: ГОСТ 34028-2016}
    height: 490              # габарит по наружным точкам
    leg: 50                  # свес конца выше центра нижнего гиба
    r_axis: 40               # радиус гиба по оси стержня
    qty: 2
    mass_ref: 1,53
    length_ref: 1270

  4:
    kind: assembly
    designation: Данный лист
    name: Закладная деталь ЗД1
    parts: [15, 16]
    qty: 2
    mass_ref: 0,87

  # ---- поз.5...12: серия квадратных хомутов, один параметрический тип ----
  hoops:
    kind: hoop_series
    section: Детали
    designation_merged: ["См. ведомость", "деталей"]
    header: 8А240 ГОСТ 34028-2016
    bar: {d: 8, cls: А240, gost: ГОСТ 34028-2016}
    qty_each: 1
    # поз: [номинальная сторона, грань с нахлёстом]. Нахлёст непостоянен
    # (49...51), поэтому хранится пара, а не один коэффициент.
    items:
      5:  [317, 368]
      6:  [350, 400]
      7:  [383, 434]
      8:  [415, 465]
      9:  [448, 497]
      10: [480, 530]
      11: [513, 562]
      12: [545, 595]
    length_ref: {5: 1370, 6: 1500, 7: 1635, 8: 1760, 9: 1890,
                 10: 2020, 11: 2150, 12: 2280}
    mass_ref: {5: "0,54", 6: "0,59", 7: "0,65", 8: "0,69", 9: "0,75",
               10: "0,80", 11: "0,85", 12: "0,90"}

  13:
    kind: bent_bar           # гнутый стержень из двух участков
    bar: {d: 12, cls: А400, gost: ГОСТ 34028-2016}
    segments: [140, 2430]
    drop: 133                # опускание дальнего конца ниже горизонтали
    qty: 8
    mass_ref: 2,28
    length_ref: 2570

  14:
    kind: plate
    strip: {t: 6, b: 50, gost: ГОСТ 103-2006,
            steel: Ст3кп2, steel_gost: ГОСТ 535-2005}
    length: 150
    holes: [{d: 10, x: 100, y: 25}]
    qty: 1
    mass_ref: 0,36
    mass_ignores_holes: true   # в исходной спецификации отверстие не вычтено

  # ---- состав ЗД1 (поз.4) ----
  15:
    kind: plate
    parent: 4
    strip: {t: 6, b: 50, gost: ГОСТ 103-2006,
            steel: Ст3кп2, steel_gost: ГОСТ 535-2005}
    length: 300
    qty: 1
    mass_ref: 0,71

  16:
    kind: anchor
    parent: 4
    bar: {d: 8, cls: А400, gost: ГОСТ 34028-2016}
    length: 200
    edge: 20                 # от торца пластины до оси анкера
    qty: 2
    mass_ref: 0,08
